# run7 机理对照 B 臂：朴素观测堆叠（`obs_stack: 3`，观测 6 -> 18 维）。
#
# 为什么要有这一档：直觉上「给策略加记忆」就该修好延迟，但**堆叠历史观测恢复不了
# 在途指令** —— 在途指令是策略自己的历史输出，被执行时又乘了每步随机增益，
# 从观测差分里反解不出来。所以预期它仍卡在 perturbed 的水平（~0.7）。
# 它的作用是当「朴素记忆不够、隐藏状态的结构才要紧」的对照，防止把 run6/run7A 的
# 结论误读成「加记忆就行」。
env_factory: perturbed

env:
  max_steps: 50
  action_scale: 0.05
  goal_radius: 0.02
  min_goal_dist: 0.10
  half_space: 0.15
  action_delay: 2
  gain_noise: 0.5
  drift: 0.004
  obs_noise: 0.0
  obs_stack: 3           # <-- 唯一变量（观测 6 -> 18 维）

train:
  algo: sac
  total_timesteps: 40000
  seed: 0
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  policy_kwargs:
    net_arch: [64, 64]
  eval_freq: 2500
  n_eval_episodes: 20

eval:
  n_episodes: 50
  seed: 12345
