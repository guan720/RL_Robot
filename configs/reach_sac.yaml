# 阶段 1b：Reach + SAC 的第一个实验配置
# 原则：所有超参写在这里，代码里不留魔法数字。
env:
  max_steps: 100        # 一局最多 100 步，超过算 truncated
  action_scale: 0.05    # action=1.0 时末端单步移动 5cm
  goal_radius: 0.03     # 距离目标 3cm 内算成功
  min_goal_dist: 0.08   # 目标至少离起点 8cm，避免太简单
  half_space: 0.15      # 工作空间是 [-15cm, 15cm]^3

train:
  algo: sac             # 连续动作首选 SAC；想对比可改 ppo
  total_timesteps: 50000
  seed: 0
  learning_rate: 3.0e-4
  buffer_size: 100000   # 经验回放池大小（SAC 是 off-policy，才需要这个）
  batch_size: 256
  gamma: 0.99           # 折扣因子：未来奖励打多少折
  tau: 0.005            # 目标网络软更新系数
  train_freq: 1
  gradient_steps: 1
  policy_kwargs:
    net_arch: [64, 64]  # 两层 64 单元 MLP，这个任务不需要更大
  eval_freq: 5000       # 每 5000 步独立评测一次，保存 best_model.zip
  n_eval_episodes: 20

eval:
  n_episodes: 50        # 最终对比评测的回合数
  seed: 12345           # 固定评测 seed，保证「训练前 vs 训练后」是同题同卷
