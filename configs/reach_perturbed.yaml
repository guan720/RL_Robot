# 阶段 3 对照实验基准：带执行延迟 + 增益不确定 + 漂移场的 Reach。
#
# === 为什么不用 reach_sac.yaml ===
# 实测它**不可判定**：SAC 在 10000~15000 步之间起飞，20000 步后一直满分
# （runs/20260922_170720_sac_reach/evaluations.npz），四臂 A/B 全部在第 2 轮
# 同时跳到 1.00（runs/ab_stage3/run1/compare.json），没有可比较的爬升段。
#
# === 为什么不用 reach_hard.yaml ===
# 只收紧判定口径没用：只要动力学还是平凡的单积分器，手写比例控制照样 100%
# （严酷口径下实测 100.0% / 2.6 步，和训了 5 万步的 SAC 打平）。**必须改动力学。**
#
# === 参数是怎么定的（scripts/calibrate_perturbed.py 实测，episodes=50 seed=999）===
#   配置                     随机    P控制g=1  P控制g=0.5  阶段1满分模型
#   无扰动(对照)             2.0%    100.0%    100.0%      100.0%
#   只加延迟2                2.0%     28.0%    100.0%       64.0%
#   只加增益噪声50%           0.0%    100.0%    100.0%      100.0%
#   只加漂移                 2.0%    100.0%    100.0%      100.0%
#   延迟2+增益50%+漂移  <==   4.0%     94.0%    100.0%       88.0%
#   延迟4+增益80%+漂移        2.0%     44.0%     72.0%       48.0%
#   延迟4+增益70%+步40        0.0%     46.0%     70.0%       44.0%
#   延迟5+增益70%+步50        2.0%     28.0%     64.0%       42.0%
#
# 一个有意思的结论：**单独加增益噪声或单独加漂移，比例控制依然 100%**；
# 只有**延迟**能真正打破它（延迟 2 就从 100% 掉到 28%）。因为比例控制是状态反馈，
# 噪声和漂移都能被反馈吸收，唯独相位滞后会让它过冲振荡。
#
# === 为什么不取最硬的「延迟4+增益70%+步40」===
# 实测 SAC 在那一档 12000 步之后仍是 0.000（比随机的 0.067 还差），
# 采集里 takeover 6 次 / reset 5 次，连不依赖训练的恢复技能都救不回来。
# 原因很可能是它已经变成**部分可观测**问题：4 步延迟意味着最优策略要记住最近
# 4 条指令，而观测只有 [ee, goal] 6 维，MLP 策略原则上拿不到最优解。
# 那一档留给以后（换 LSTM 策略或把延迟状态放进观测），不适合当第一个对照基准。
#
# === 本配置的可学习性实测（runs/harness_smoke/mild_probe）===
#   起点(随机)        标准 0.000
#   5000 步           标准 0.000
#   10000 步          标准 0.000
#   15000 步          标准 0.000
#   20000 步          标准 0.100  <- 开始爬升，门禁通过并发布
# 也就是说起飞点在 1.5~2 万步，之后有足够长的爬升段可以比较两种采样的速度。
# 参考基线：随机 4%、手写比例控制 94%（g=1）/ 100%（g=0.5）。
# **RL 要证明自己有价值，就得超过 94% 这条手写控制线。**
env_factory: perturbed

env:
  max_steps: 50
  action_scale: 0.05
  goal_radius: 0.02
  min_goal_dist: 0.10
  half_space: 0.15
  # --- 扰动（这三个才是让任务不平凡的原因）---
  action_delay: 2        # 指令发出后 2 步才生效（真机上是通信 + 控制器周期）
  gain_noise: 0.5        # 每个轴的实际增益在 [0.5, 1.5] 倍之间随机
  drift: 0.004           # 绕 z 轴的横向漂移场，每步最多 4mm
  obs_noise: 0.0         # 观测噪声先不开：它是另一个实验变量，不要和这三个混在一起

train:
  algo: sac
  total_timesteps: 60000
  seed: 0
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  policy_kwargs:
    net_arch: [64, 64]
  eval_freq: 2500
  n_eval_episodes: 20

eval:
  n_episodes: 50
  seed: 12345
