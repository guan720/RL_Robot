# 阶段 2 加难度版：带扰动的正反向搬运（envs/transport_perturbed.py）
#
# === 为什么要有这个配置 ===
# 阶段 2 在理想环境 configs/transport_sac.yaml 上的实测结论是「环境已到天花板」：
#   SAC 60000 步 -> 3637 个任务 / 98.6%
#   20 行手写比例控制器 -> 3627 个任务 / 98.6%
#   （runs/20260922_205020_stage2_compare）
# RL 只是**打平**了脚本上界，于是阶段 2 真正想研究的那个风险——
# 「reset-free 交替会不会让起始状态分布塌缩」——在训练后的策略上根本没机会出现
# （起始覆盖满格 36/36、熵 0.994）。要研究它，必须先让策略变得**不那么可靠**。
#
# === 参数是怎么定的（scripts/calibrate_transport.py 实测，不是拍脑袋）===
# 判据：随机策略≈0% 且「最强脚本基线」落在 55~88% 之间——这样 RL 才有明确的超越目标，
#       又不至于硬到 MLP 学不动（阶段 3 的教训：长延迟会把问题变成部分可观测）。
# 脚本基线同时扫了两个族，取**两族里最好的一档**当天花板（只跟调小增益的 P 比会自欺）：
#   P  族  action = clip(g*(subgoal-ee)/scale, -1, 1)
#   PD 族  action = clip((kp*(subgoal-ee) - kd*v)/scale, -1, 1)，v = 相邻两帧位移差
#
# 第一轮（runs/infra/20260923_113232_transport_calib.json，6000 步 x 2 seed，alternate）
#   配置                       随机   最强脚本        阶段2满分模型
#   无扰动(=阶段2)             4.9%   98.7% pd_1:0.2    98.6%
#   只加延迟1(真延迟)          4.9%   98.4% pd_0.6:0.3  94.2%
#   只加漂移0.010              0.0%   98.6% pd_1:0.2    97.6%
#   只加接近限速0.018          0.0%   98.7% pd_1:0.2    98.6%
#   漂0.012+限0.022+延1        0.0%   97.9% pd_0.6:0.3  86.8%
#   hard 预设(真延迟2)         0.0%   51.7% p_g0.7      41.2%   <- 太硬
#   hard 但延迟1               0.0%   79.0% pd_1:0.5    73.6%   <- 在带内
#   漂0.016+限0.026+延1        0.0%   81.8% pd_1:0.2    78.6%   <- 在带内，但撞飞 12 次/任务
#
# 第二轮（runs/infra/round2_transport_calib.json，12000 步 x 2 seed，alternate）
#   候选C 限0.026滑4噪45       0.0%   82.7% pd_1:0.5    81.9%   撞飞 4.23/任务  吞吐 25.2/1k
#   候选D 限0.030载0.70  <==   0.0%   85.5% p_g0.7      84.2%   撞飞 1.94/任务  吞吐 29.5/1k
#   候选E D 去掉滑落           0.0%   85.9% pd_1:0.5    77.9%   撞飞 2.46/任务  吞吐 33.8/1k
#   候选F 限0.026滑3漂0.006    0.0%   89.6% p_g0.7      84.0%   撞飞 1.61/任务  <- 偏简单
#   候选G F 去掉漂移           0.4%   97.0% p_g0.35     77.3%   <- 去掉漂移后脚本又满分
#   候选H 漂16限26延1          0.0%   84.4% pd_1:0.2    78.7%   撞飞 10.80/任务 <- 太「弹球」
#
# 选 候选D 的理由：脚本 85.5%（在带内、留了约 15 个点的头可抬）、随机 0%、
#   撞飞只有 1.94 次/任务（H 那种 10+ 次/任务的「弹球」动力学不适合当第一个基准）、
#   吞吐 29.5 任务/千步（150000 步能攒到 ~4400 个任务，够 SAC 学）。
#
# === 三个互相拉扯的压力，才是「RL 有可学的东西」的严格含义 ===
#   1. approach_speed_limit  进入抓取圈那一刻速度必须 <= 3cm/步，否则把物体撞飞 -> 要求**慢慢接近**
#   2. slip_prob             搬运途中每步 4% 概率掉物，掉物次数 ~ p x 搬运步数   -> 要求**快快搬走**
#   3. drift                 每局随机方向的常值漂移 8mm/步；停得住要求稳态偏移
#                            |e_ss| ~= drift/增益 < 2cm 抓取圈               -> 要求**近处大增益**
#   再叠加 gain_noise（每局随机增益 0.5~1.5 倍）和 payload_gain（抓着物体才降速 0.70 倍）：
#   **同一局里 seek 相和 carry 相是两个不同的被控对象，每局之间增益还在变**。
#   任何一组固定的 (g) 或 (kp,kd) 都不可能同时满足上面三条 -> 这就是脚本上界被压到 85% 的原因。
#   而策略网络可以做**增益调度**（远处小增益慢慢蹭、进圈附近大增益硬顶漂移、抓到后加速搬），
#   这是固定增益控制器表达不出来的。RL 要证明自己有价值，就得超过 85.5% 这条线。
#
# === action_delay 只取 1，不取 2 ===
# 标定里真延迟 2 时最强脚本只有 51.7%、阶段 2 满分模型只剩 41.2%，已经偏硬；
# 而且延迟 >= 2 会让最优策略依赖「上一步发过什么指令」，7 维观测的 MLP 原则上拿不到最优解
# （阶段 3 在 Reach 上实测过长延迟下 SAC 学不动）。延迟 1 仍然能打破「增益 1 的纯 P」
# （e_{t+1} = e_t - g*e_{t-1}，g=1 时特征根模长恰为 1 -> 等幅振荡），够用且可学。
#
# === 一条纪律 ===
# 扰动只影响「策略能看到什么、能做到什么」，绝不影响「环境怎么判成败」：
# obs_noise 保持 0（不混入第二个变量），抓取/放置判定与 36 格覆盖统计全部用真实状态算。
# 所以这张表和阶段 2 理想环境那张表的**指标口径完全一致**，可以直接对比。

env_factory: perturbed

env:
  # --- 与 configs/transport_sac.yaml 完全相同的基础参数（保证口径可比）---
  half: 0.15            # 工作空间 [-15cm, 15cm]^2 的半边长
  gap: 0.02             # A 区 x < -gap，B 区 x > +gap
  action_scale: 0.04    # action=1.0 时末端单步移动 4cm
  pick_radius: 0.02     # 空手时离物体 2cm 内 -> 抓起
  place_radius: 0.02    # 抓着时离目标 2cm 内 -> 放下（= 一个 task 成功）
  max_steps: 400
  stall_limit: 120      # 连续 120 步无 task 完成 -> 规则式救场（manual_resets += 1）
  grid_n: 6             # 覆盖率网格 6x6 = 36 格
  reset_mode: alternate
  pick_bonus: 2.0
  place_bonus: 8.0
  # --- 扰动（候选D，六个旋钮，逐条对应上面的三股压力）---
  action_delay: 1              # 指令发出后 1 步才生效（打破增益 1 的纯比例控制）
  gain_noise: 0.50             # 每局随机一个增益偏置，实际增益在 [0.5, 1.5] 倍之间
  drift: 0.008                 # 每局随机方向的常值漂移，8mm/步（要求近处大增益）
  payload_gain: 0.70           # 抓着物体时位移只有 70%（seek/carry 两个被控对象）
  approach_speed_limit: 0.030  # 进圈速度超过 3cm/步 -> 把物体撞飞 push_dist，这一抓落空
  push_dist: 0.045
  slip_prob: 0.04              # 搬运中每步 4% 概率掉物（要求快快搬走）
  slip_dist: 0.045
  obs_noise: 0.0               # 刻意保持 0：判定用真值，且不与动力学变量混在一起

compare:
  steps: 20000          # 每个 (策略,模式,seed) 的交互预算（与阶段 2 一致）
  seeds: [0, 1, 2]
  easy_radius: 0.06     # biased 策略的舒适区半径（与阶段 2 一致，扫描范围也一致）
  reset_cost_steps: 30
  scan_easy_radius: [0.03, 0.05, 0.07, 0.09, 0.11, 0.13]

train:
  algo: sac
  total_timesteps: 150000   # 扰动后每个任务约 34 步（理想环境约 5.5 步），所以预算放到 2.5 倍
  seed: 0
  learning_rate: 3.0e-4
  buffer_size: 100000       # 与阶段 2 保持一致：除了环境，别的同时改两样东西
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  policy_kwargs:
    net_arch: [128, 128]
  eval_freq: 5000
  n_eval_episodes: 3
  save_freq: 10000

eval:
  steps: 20000          # 冻结评测：每个 seed 烧 20000 步
  seeds: [0, 1, 2]
  inline_steps: 4000    # 训练途中的评测预算（便宜，否则评测比训练还慢）
  inline_seeds: [0]
