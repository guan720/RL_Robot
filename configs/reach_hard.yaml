# 阶段 3 对照实验专用：把 Reach 调难，让成功率**不饱和**，A/B 才有分辨力。
#
# 为什么需要它？实测（runs/20260922_170720_sac_reach/evaluations.npz）显示，
# 默认 reach_sac.yaml 下 SAC 在 10000~15000 步之间就起飞，20000 步以后一直是满分：
#     5000 步 平均回报 -8.78 / 平均 86.1 步
#    10000 步 平均回报 -10.20 / 平均 85.6 步   <- 还没学会
#    15000 步 平均回报 +9.11 / 平均 7.4 步     <- 起飞
#    20000 步 平均回报 +9.87 / 平均 2.6 步     <- 饱和
# 两臂都会在 2 万步内撞到 100%，「哪种采样学得更快」这个问题就无从比较。
#
# 这里只收紧判定口径，不改控制量纲（action_scale 保持不变），
# 相当于把 registry 的「严酷探针」直接当成训练任务：
#     goal_radius   0.03 -> 0.02   成功圈收到 2cm
#     min_goal_dist 0.08 -> 0.10   目标更远一点
#     max_steps     100  -> 50     步数上限砍半
# 已知随机策略在这个口径下约 3.5%（见 scripts/eval_policy.py 的说明），
# 阶段 1 的满分模型是 100% —— 上下界都留足了，才有可比较的中间地带。
env:
  max_steps: 50
  action_scale: 0.05
  goal_radius: 0.02
  min_goal_dist: 0.10
  half_space: 0.15

train:
  algo: sac
  total_timesteps: 40000
  seed: 0
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  policy_kwargs:
    net_arch: [64, 64]
  eval_freq: 2500
  n_eval_episodes: 20

eval:
  n_episodes: 50
  seed: 12345
