# 机理对照（2026-09-23，§6.6 挂着的待验证假设）：把 action_delay 归零，其余扰动不变。
#
# 问的问题只有一个：reach_perturbed 上「uniform 60k 步只到 0.62~0.76、离手写控制 0.94
# 差一截」这个残差，是不是 **action_delay=2 造成的部分可观测**（MLP 观测只有 [ee, goal]
# 6 维，拿不到在途指令）？
#   · 若本配置下 uniform 40k 步就能到 0.9+  -> 残差是可观测性，「换练习题」在 Reach 上
#     原则上补不了它，本基准退役为「加速学习」试验田；
#   · 若仍卡在 0.7 附近                      -> 残差是容量/奖励形状问题，同样退役，但换理由。
# 两个结论都指向同一个动作：把 harness 搬去接触物理环境。
#
# 保留 gain_noise / drift 是刻意的：只关延迟这一个变量（§6.6 的纪律：一次只换一层）。
# 注意 calibration 表里「只加增益噪声 / 只加漂移」时比例控制仍 100%，所以本配置若被 SAC
# 快速打满，本身就是答案的一部分（难度全部来自延迟）。
env_factory: perturbed

env:
  max_steps: 50
  action_scale: 0.05
  goal_radius: 0.02
  min_goal_dist: 0.10
  half_space: 0.15
  action_delay: 0        # <-- 唯一变量
  gain_noise: 0.5
  drift: 0.004
  obs_noise: 0.0

train:
  algo: sac
  total_timesteps: 40000
  seed: 0
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  policy_kwargs:
    net_arch: [64, 64]
  eval_freq: 2500
  n_eval_episodes: 20

eval:
  n_episodes: 50
  seed: 12345
