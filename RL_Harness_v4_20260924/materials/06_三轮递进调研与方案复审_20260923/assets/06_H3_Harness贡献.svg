><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">固定程序库</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">使用已有纠正与恢复能力</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">继续采样和训练</tspan></text></g></g><g transform="translate(364.5, 148.5)" data-id="G" data-node="true" id="flowchart-G-4" class="node default learn flowchart-label"><rect height="75" width="233" y="-37.5" x="-116.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -30)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">允许程序扩展</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">受限试验 → 验证发布</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">记录监督、交互及练习机会</tspan></text></g></g><g transform="translate(235.75, 277.5)" data-id="E" data-node="true" id="flowchart-E-6" class="node default result flowchart-label"><rect height="75" width="257.34375" y="-37.5" x="-128.671875" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -30)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">冻结两组训练所得 policy</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">撤去 Harness 任务内动作辅助</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">共同留出起态与固定判据</tspan></text></g></g><g transform="translate(397.01904296875, 430.5)" data-id="J" data-node="true" id="flowchart-J-10" class="node default result flowchart-label"><rect height="75" width="322" y="-37.5" x="-161" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -30)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">核心结论</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">policy 独立能力是否提高</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">达到同等能力的人工与总成本是否下降</tspan></text></g></g><g transform="translate(558.2880859375, 277.5)" data-id="D" data-node="true" id="flowchart-D-11" class="node default common flowchart-label"><rect height="75" width="319.732421875" y="-37.5" x="-159.8662109375" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -30)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">运行归因诊断：单独冻结，不训练</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">旧／新 policy × 旧／新 Harness 四组</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">另测两个 policy 无动作辅助</tspan></text></g></g><g transform="translate(397.01904296875, 550.5)" data-id="N" data-node="true" id="flowchart-N-14" class="node default result flowchart-label"><rect height="57" width="347.734375" y="-28.5" x="-173.8671875" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -21)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">程序扩展只能改善救场？</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">则报告系统收益，不宣称 policy 学习收益</tspan></text></g></g></g></g></g></svg>